excluded:
  - DerivedData
  - .derivedData
  - Build
  - build
  - .build

custom_rules:
  discouraged_optional_try:
    name: "Discouraged optional try (try?)"
    regex: '(^|[^A-Za-z0-9_])try\?'
    message: "Avoid try? in production code — prefer do/catch or propagating throws."
    severity: warning
    included: "Sources"
    excluded:
      - Tests
  unsafe_index:
    name: "Unsafe direct index access [0]"
    regex: '\[0\]'
    message: "Avoid direct [0] subscript — use .first with guard/optional handling to prevent out-of-bounds crashes."
    severity: warning
    excluded:
      - Tests

disabled_rules:
  - inclusive_language
  - opening_brace

type_name:
  excluded:
    - iCloudStatusView

identifier_name:
  min_length:
    warning: 2
  max_length:
    warning: 50

line_length:
  warning: 200

file_length:
  warning: 1000

type_body_length:
  warning: 750

function_body_length:
  warning: 120

function_parameter_count:
  warning: 8

cyclomatic_complexity:
  warning: 15
